version: 2

models:
  - name: mart_customer_rfm
    columns:
      - name: user_id
        data_tests: [unique, not_null]
      - name: customer_segment
        data_tests:
          - accepted_values:
              arguments:
                values: ['VIP', 'Loyal', 'Active', 'Lapsed', 'Never purchased']
      - name: historical_revenue
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
  - name: mart_marketing_attribution
    columns:
      - name: channel
        data_tests: [unique, not_null]
      - name: total_spend
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: customers_acquired
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
  - name: fct_marketing_spend
    description: "Daily ad spend by channel (30 days x 5 channels)."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [spend_date, campaign_channel]
      - dbt_utils.expression_is_true:
          arguments:
            expression: "clicks <= impressions"
    columns:
      - name: spend_amount
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0

  - name: dim_customers
    description: "One row per user with demographics and CRM attributes where available."
    columns:
      - name: user_id
        data_tests:
          - unique
          - not_null
      - name: customer_persona
        data_tests:
          - accepted_values:
              arguments:
                values: ['Budget Shopper', 'Impulse Buyer', 'Brand Loyalist', 'Window Shopper']
      - name: loyalty_score
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 100

  - name: fct_sessions
    description: "One row per web session, with resolved user and mapped ad channel."
    columns:
      - name: session_id
        data_tests:
          - unique
          - not_null
      - name: user_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: user_id
      - name: events_count
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1