name: 'nexvia_dbt'
version: '1.0.0'

profile: 'nexvia_dbt'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

# staging = light renaming/casting of raw tables (views)
# intermediate = sessionised web events (tables)
# marts / analytics = tables that Tableau reads
models:
  nexvia_dbt:
    staging:
      +materialized: view
    intermediate:
      +materialized: table
    marts:
      +materialized: table
    analytics:
      +materialized: table
